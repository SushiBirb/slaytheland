# ==============================================================================
# slaytheland - Slay the Princess Hyprlock Configuration
# Aesthetic: Hand-Drawn Charcoal, Antique Parchment & Pristine Blade Crimson
# ==============================================================================

general {
    hide_cursor = false
}

background {
    monitor =
    path = /home/arch/slaytheland/assets/wallpapers/_ztlq/big/ztlq_1.jpg
    color = rgba(13, 11, 15, 1.0)

    blur_passes = 2
    blur_size = 5
    noise = 0.02
    contrast = 0.9
    brightness = 0.7
    vibrancy = 0.1
}

# Mirror Frame / Princess Avatar
image {
    monitor =
    path = /home/arch/slaytheland/assets/gui/window_icon.png
    size = 120
    rounding = -1
    border_size = 3
    border_color = rgba(199, 44, 65, 0.9)
    rotate = 0
    reload_time = -1
    position = 0, 160
    halign = center
    valign = center
}

# The Narrator's Greeting
label {
    monitor =
    text = You're on a path in the woods...
    color = rgba(247, 245, 230, 0.95)
    font_size = 28
    font_family = Kelmscott Roman NF
    position = 0, 70
    halign = center
    valign = center
}

# Subtitle / Fate
label {
    monitor =
    text = ...and at the end of that path is a cabin.
    color = rgba(232, 221, 197, 0.75)
    font_size = 22
    font_family = Amatic SC
    position = 0, 25
    halign = center
    valign = center
}

# Password Input Field (Pristine Blade)
input-field {
    monitor =
    size = 320, 50
    outline_thickness = 2
    dots_size = 0.28
    dots_spacing = 0.25
    dots_center = true
    dots_rounding = -1

    font_family = Amatic SC
    font_color = rgba(232, 221, 197, 1.0)

    inner_color = rgba(21, 18, 24, 0.9)
    outer_color = rgba(199, 44, 65, 0.8)
    check_color = rgba(212, 163, 115, 0.9)
    fail_color = rgba(224, 36, 56, 1.0)

    fade_on_empty = false
    placeholder_text = <span foreground="##706578">Take the blade and enter...</span>
    fail_text = <span foreground="##e02438">She will kill you if you fail.</span>

    position = 0, -60
    halign = center
    valign = center
}

# Current Time
label {
    monitor =
    text = $TIME
    color = rgba(247, 245, 230, 0.6)
    font_size = 18
    font_family = Kelmscott Roman NF
    position = 0, -130
    halign = center
    valign = center
}
