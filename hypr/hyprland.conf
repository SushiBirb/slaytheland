# ==============================================================================
# slaytheland - Slay the Princess Hyprland Configuration
# Aesthetic: Hand-Drawn Charcoal, Antique Parchment & Pristine Blade Crimson
# ==============================================================================

# Monitor configuration (flexible for nested window or native monitor)
monitor=,preferred,auto,1

# Cursors environment
env = XCURSOR_THEME,SlayThePrincess
env = XCURSOR_SIZE,32
env = HYPRCURSOR_THEME,SlayThePrincess
env = HYPRCURSOR_SIZE,32

# Input configuration
input {
    kb_layout = us
    follow_mouse = 1
    touchpad {
        natural_scroll = no
    }
}

# Window layout & borders
general {
    gaps_in = 6
    gaps_out = 12
    border_size = 2
    # Crimson to dried blood dual-tone gradient
    col.active_border = rgba(c72c41ee) rgba(801336ee) 45deg
    col.inactive_border = rgba(3a323dbb)
    layout = dwindle
}

# Visual decorations (charcoal shadows & ambient dark blur)
decoration {
    rounding = 6
    blur {
        enabled = true
        size = 5
        passes = 2
        new_optimizations = true
    }
}

# Smooth and tense animations
animations {
    enabled = yes
    bezier = sharpEase, 0.16, 1, 0.3, 1
    bezier = tension, 0.2, 0.8, 0.2, 1

    animation = windows, 1, 4, sharpEase
    animation = windowsOut, 1, 4, sharpEase, popin 80%
    animation = border, 1, 6, default
    animation = fade, 1, 4, tension
    animation = workspaces, 1, 4, sharpEase, slide
}

dwindle {
    preserve_split = yes
}

misc {
    disable_hyprland_logo = true
    disable_splash_rendering = true
}

# Autostart core components
exec-once = /usr/lib/polkit-kde-authentication-agent-1 &
exec-once = quickshell -c slaytheland &
exec-once = hyprctl setcursor SlayThePrincess 32
exec-once = slay-wall-cycle &

# Keybindings
$mainMod = SUPER

# Applications & Quickshell Surfaces
bind = $mainMod, Return, exec, kitty
bind = $mainMod, Space, global, slay:launcher
bind = $mainMod, Escape, global, slay:quicksettings
bind = $mainMod, comma, global, slay:hub
bind = $mainMod, G, global, slay:princess
bind = $mainMod, R, global, slay:room
bind = $mainMod, X, global, slay:dialogue
bind = $mainMod, K, global, slay:cheatsheet
bind = $mainMod, L, exec, hyprlock
bind = $mainMod, W, exec, slay-wall-cycle

# Media, Volume and Brightness Keys
bindel = , XF86AudioRaiseVolume, exec, wpctl set-volume -l 1.5 @DEFAULT_AUDIO_SINK@ 5%+
bindel = , XF86AudioLowerVolume, exec, wpctl set-volume @DEFAULT_AUDIO_SINK@ 5%-
bindl = , XF86AudioMute, exec, wpctl set-mute @DEFAULT_AUDIO_SINK@ toggle
bindel = , XF86MonBrightnessUp, exec, brightnessctl set 5%+
bindel = , XF86MonBrightnessDown, exec, brightnessctl set 5%-

# Window Management
bind = $mainMod, Q, killactive,
bind = $mainMod, V, togglefloating,
bind = $mainMod, F, fullscreen, 0
bind = $mainMod, S, togglespecialworkspace, scratch
bind = $mainMod, M, exit,

# Focus navigation (Vim keys & Arrows)
bind = $mainMod, left, movefocus, l
bind = $mainMod, right, movefocus, r
bind = $mainMod, up, movefocus, u
bind = $mainMod, down, movefocus, d
bind = $mainMod, h, movefocus, l
bind = $mainMod, l, movefocus, r
bind = $mainMod, k, movefocus, u
bind = $mainMod, j, movefocus, d

# Workspaces (Roman numerals I to V)
bind = $mainMod, 1, workspace, 1
bind = $mainMod, 2, workspace, 2
bind = $mainMod, 3, workspace, 3
bind = $mainMod, 4, workspace, 4
bind = $mainMod, 5, workspace, 5

# Move window to workspace
bind = $mainMod SHIFT, 1, movetoworkspace, 1
bind = $mainMod SHIFT, 2, movetoworkspace, 2
bind = $mainMod SHIFT, 3, movetoworkspace, 3
bind = $mainMod SHIFT, 4, movetoworkspace, 4
bind = $mainMod SHIFT, 5, movetoworkspace, 5

# Mouse bindings
bindm = $mainMod, mouse:272, movewindow
bindm = $mainMod, mouse:273, resizewindow
