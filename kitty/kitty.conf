# ==============================================================================
# slaytheland - Kitty Terminal Theme
# Aesthetics: Slay the Princess (Charcoal, Parchment, Blade Steel & Crimson)
# ==============================================================================

font_family      monospace
font_size        11.5

window_padding_width 14
background_opacity 0.92
dynamic_background_opacity yes

# Cursor styling
cursor            #c72c41
cursor_text_color #110f13
cursor_shape      block
cursor_blink_interval 0.5

# Selection
selection_background #801336
selection_foreground #ffffff

# The Slay the Princess Charcoal & Blood Palette
foreground #e8ddc5
background #110f13

# Black (Charcoal)
color0  #1a161d
color8  #4a434d

# Red (Crimson / Blood)
color1  #c72c41
color9  #e02438

# Green (Woods & Foliage)
color2  #5c7c5d
color10 #7e9c7f

# Yellow (Candlelight Amber)
color3  #d4a373
color11 #f0c293

# Blue (Dusk & Shadow)
color4  #4f5d75
color12 #6b7d99

# Magenta (Wine & Wound)
color5  #801336
color13 #a3224b

# Cyan (Cold Blade Steel)
color6  #78909c
color14 #90a4ae

# White (Antique Parchment)
color7  #e8ddc5
color15 #ffffff

# URL underline & styling
url_color #c72c41
url_style curly

# Tab bar styling
tab_bar_style powerline
tab_powerline_style slanted
active_tab_foreground   #e8ddc5
active_tab_background   #801336
inactive_tab_foreground #6e6473
inactive_tab_background #1a161d
